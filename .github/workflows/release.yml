# Builds matchmaker for Windows and Linux. A version tag (v0.1.0) also
# publishes the zips as that version's release, where Husky finds them
# (husky.config.json); started by hand it only builds.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            exe: matchmaker.exe
          - name: linux-x86_64
            os: ubuntu-24.04
            exe: matchmaker
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Zip
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $zip = "matchmaker-$version-${{ matrix.name }}.zip"
          # Husky lays the zip over its folder: the program goes in app/.
          New-Item -ItemType Directory -Force -Path staging/app | Out-Null
          Copy-Item target/release/${{ matrix.exe }} staging/app/
          Compress-Archive -Path staging/app -DestinationPath $zip
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: The version Husky reads
        if: runner.os == 'Windows'
        shell: pwsh
        run: (Get-Item target/release/matchmaker.exe).VersionInfo | Format-List FileVersion, ProductVersion

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ZIP }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" matchmaker-*.zip --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
